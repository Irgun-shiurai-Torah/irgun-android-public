name: Android Admin Parity QA (branch only)

on:
  push:
    branches:
      - feature/android-admin-website-parity-20261019
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irgun-admin-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Validate admin actions and existing Android gestures
        run: node --test scripts/test_android_admin_parity.mjs scripts/test_android_sources.mjs scripts/test_android_swipe_motion.mjs
      - name: Prepare selected icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          bash scripts/prepare_android_icons.sh
      - name: Compile web and Android
        env:
          VITE_ANDROID_MEDIA3_VIDEO_BETA: 'true'
        run: |
          npm run build
          npx cap sync android
      - name: Verify real R8 release build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Verify source maps and release APK
        run: |
          test -s android/app/build/outputs/mapping/release/mapping.txt
          ls android/app/build/outputs/apk/release/*.apk >/dev/null
      - name: Upload diagnostic build reports on failures
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: admin-parity-debug-${{ github.run_number }}
          path: |
            android/app/build/reports/
            android/app/build/outputs/mapping/release/
          retention-days: 7
