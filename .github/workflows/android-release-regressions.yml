  hls-app-picture-and-quality:
    name: Native Media3 HLS in actual app Android API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 38
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34, 35, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
