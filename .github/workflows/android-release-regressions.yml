name: Android release regression matrix

on:
  workflow_dispatch:
  pull_request:
    branches: [main, test/android-release-regressions]
    paths:
      - '.github/release-tests/**'
      - '.github/account-tests/**'
      - '.github/android-native-observer/**'
      - 'scripts/android-native-hierarchy.mjs'
      - 'scripts/android-adb-observer.mjs'
      - 'scripts/test_android_adb_observer.mjs'
      - 'scripts/android-native-text-entry.mjs'
      - 'scripts/test_android_native_text_entry.mjs'
      - 'scripts/android-system-ui-observation.mjs'
      - 'scripts/test_android_system_ui_observation.mjs'
      - 'scripts/android-native-tap-point.mjs'
      - 'scripts/android-account-playback-fixture.mjs'
      - 'scripts/test_android_native_tap_point.mjs'
      - 'scripts/android-emulator-prepare.py'
      - 'scripts/test_android_emulator_prepare.mjs'
      - 'scripts/android-emulator-sdk-preflight.sh'
      - 'scripts/test_android_offline_account.mjs'
      - 'scripts/test_android_network_evidence.mjs'
      - 'scripts/android-network-evidence.mjs'
      - 'scripts/android-emulator-mp4.mjs'
      - 'scripts/android-emulator-media.sh'
      - '.github/workflows/android-release-regressions.yml'
      - 'scripts/android-regression-extensions.mjs'
      - 'scripts/android-emulator-soak.mjs'
      - 'scripts/android-emulator-audio-start.mjs'
      - 'scripts/android-website-account-sync.mjs'
      - 'scripts/android-comments-qa.mjs'
      - 'scripts/android-hls-delivery-probe.mjs'
      - 'scripts/android-probe-request.mjs'
      - 'scripts/test_android_probes.mjs'
      - 'scripts/android-audio-download-probe.mjs'
      - 'scripts/android-emulator-hls.mjs'
      - 'scripts/android-emulator-hls.sh'
      - 'scripts/android-emulator-native-media3.mjs'
      - 'scripts/android-video-display-regression.mjs'
      - 'scripts/android-task-dismissal-regression.mjs'
      - 'scripts/test_android_task_dismissal.mjs'
      - 'scripts/android-emulator-vimeo.mjs'
      - 'scripts/android-emulator-native-media3.sh'
      - 'scripts/test_android_native_media3_beta.mjs'
      - 'scripts/test_android_vimeo_playback.mjs'
      - 'scripts/test_android_video_display.mjs'
      - 'scripts/test_android_bottom_navigation.mjs'
      - 'scripts/android-emulator-account.mjs'
      - 'scripts/android-emulator-paid-playback.mjs'
      - 'scripts/test_admin_website_parity.mjs'
      - 'scripts/test_android_sources.mjs'
      - 'scripts/test_android_paid_collections.mjs'
      - 'scripts/test_android_share_video.mjs'
      - 'scripts/test_android_watch_mini_dialog.mjs'
      - 'scripts/test_android_media_recovery.mjs'
      - 'scripts/android-native-picture-evidence.mjs'
      - 'scripts/test_android_seek_guard.mjs'
      - 'scripts/test_tab_swipes.cjs'
      - 'src/**'
      - 'android/**'

permissions:
  contents: read

# Matrix jobs share a single authenticated test account. The whole matrix must
# be serialized across pushes; newer commits supersede obsolete emulator runs.
# Within one run, max-parallel: 1 executes all four account API levels in turn.
# A job-level shared concurrency key instead cancels pending matrix children.
concurrency:
  group: irgun-android-complete-regression-matrix
  cancel-in-progress: true

jobs:
  media-and-device:
    name: Native media Android API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34, 35, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Check real regression scripts can parse
        run: |
          node --check scripts/android-regression-extensions.mjs
          node --check scripts/android-website-account-sync.mjs
          node --check scripts/android-emulator-paid-playback.mjs
          node --check scripts/android-hls-delivery-probe.mjs
      - name: Check source and gesture unit regressions
        timeout-minutes: 2
        run: node --test scripts/test_admin_website_parity.mjs scripts/test_android_task_dismissal.mjs scripts/test_android_bottom_navigation.mjs scripts/test_android_video_display.mjs scripts/test_tab_swipes.cjs scripts/test_android_sources.mjs scripts/test_android_media_source.mjs scripts/test_android_vimeo_playback.mjs scripts/test_android_player_controls.mjs scripts/test_android_probes.mjs scripts/test_android_seek_guard.mjs scripts/test_android_adb_observer.mjs scripts/test_android_native_tap_point.mjs scripts/test_android_native_text_entry.mjs scripts/test_android_video_startup_buffer.mjs scripts/test_android_system_ui_observation.mjs scripts/test_android_emulator_prepare.mjs scripts/test_android_offline_account.mjs scripts/test_android_network_evidence.mjs scripts/test_android_background_handoff.mjs scripts/test_android_native_media3_beta.mjs scripts/test_android_like_persistence.mjs scripts/test_android_home_position.mjs scripts/test_android_paid_collections.mjs scripts/test_android_share_video.mjs scripts/test_android_watch_mini_dialog.mjs scripts/test_android_media_recovery.mjs
      - name: Verify current Android player source and packaged web assets
        run: npm run test:player

      - name: Prepare selected launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          bash scripts/prepare_android_icons.sh
      - name: Append read-only QA instrumentation to disposable APK
        run: cat .github/release-tests/observer.js >> src/main.js
      - run: npm run build
      - run: npx cap sync android
      - name: Generate Android launcher resources
        run: bash scripts/prepare_android_icons.sh
      - name: Add emulator-only native output volume observation
        run: python3 scripts/android-emulator-prepare.py --with-hierarchy-observer
      - run: chmod +x android/gradlew
      - run: ./gradlew --no-daemon :app:assembleDebug :qa-native-observer:assembleDebug
        working-directory: android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate emulator SDK download for Android API ${{ matrix.api-level }}
        run: bash scripts/android-emulator-sdk-preflight.sh ${{ matrix.api-level }}
      - name: Logged-out Android media, interruptions, notification controls, offline restart, rotation and speed
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: bash scripts/android-emulator-media.sh
      - name: Save actual Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-media-api-${{ matrix.api-level }}-${{ github.run_id }}
          path: emulator-report/
          if-no-files-found: warn
          retention-days: 14


  fifteen-minute-soak:
    name: Real 15-minute Android 11 native Media3 HLS playback reliability
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Check soak test syntax
        run: |
          node --check scripts/android-emulator-native-media3.mjs
          node --test scripts/test_android_native_media3_beta.mjs
      - name: Prepare icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          bash scripts/prepare_android_icons.sh
      - name: Append read-only native Media3 observation to disposable soak APK
        run: cat .github/release-tests/observer.js >> src/main.js
      - run: npm run build
      - run: npx cap sync android
      - run: python3 scripts/android-emulator-prepare.py --with-hierarchy-observer
      - run: chmod +x android/gradlew
      - run: ./gradlew --no-daemon :app:assembleDebug :qa-native-observer:assembleDebug
        working-directory: android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate Android 11 emulator SDK download
        run: bash scripts/android-emulator-sdk-preflight.sh 30
      - name: Play a real shiur continuously for 15 minutes with screen locks and Home reopening
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: bash scripts/android-emulator-native-media3.sh soak
      - name: Upload 15-minute observation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-native-media3-soak-${{ github.run_id }}
          path: emulator-report/
          if-no-files-found: error
          retention-days: 14

  android-offline-source:
    name: Real Android downloadable audio response
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify downloaded MP3 has real playable audio bytes
        run: node scripts/android-audio-download-probe.mjs
      - name: Save HTTP status and payload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-offline-source-${{ github.run_id }}
          path: emulator-report/android-audio-download.json
          if-no-files-found: error
          retention-days: 14

