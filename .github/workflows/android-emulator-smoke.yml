name: Android emulator startup check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'scripts/android-emulator-*'
      - 'scripts/test_android_emulator_prepare.mjs'
      - 'scripts/prepare_android_icons.sh'
      - 'app-icon-v*-master.png'
      - 'src/**'
      - 'android/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'scripts/android-emulator-*'
      - 'scripts/test_android_emulator_prepare.mjs'
      - 'src/**'
      - 'android/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.*'

permissions:
  contents: read

# The emulator takes several minutes to build and boot. When a PR is updated,
# cancel only its older startup runs so CI validates the latest app and fixes
# without burning emulator minutes on obsolete commits.
concurrency:
  group: irgun-android-startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Prepare selected launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          bash scripts/prepare_android_icons.sh
      - name: Check tab gesture regressions
        run: node --test scripts/test_tab_swipes.cjs scripts/test_android_swipe_motion.mjs scripts/test_android_sources.mjs scripts/test_android_native_tap_point.mjs scripts/test_android_native_text_entry.mjs scripts/test_android_video_startup_buffer.mjs scripts/test_android_emulator_prepare.mjs scripts/test_android_background_handoff.mjs scripts/test_android_like_persistence.mjs scripts/test_android_home_position.mjs scripts/test_android_native_media3_beta.mjs
      - name: Append required read-only playback and search observer to disposable APK
        run: cat .github/release-tests/observer.js >> src/main.js
      - run: npm run build
      - run: npx cap sync android
      - name: Generate Android launcher resources
        run: bash scripts/prepare_android_icons.sh
      - name: Add emulator-only native volume observation
        run: python3 scripts/android-emulator-prepare.py --with-hierarchy-observer
      - run: chmod +x android/gradlew
      - run: ./gradlew --no-daemon :app:assembleDebug :qa-native-observer:assembleDebug
        working-directory: android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android 11 tabs, native Media3 HLS video and physical Audio/Video switching
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: bash scripts/android-emulator-smoke.sh
      - name: Save screenshot and crash report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-startup-${{ github.run_id }}
          path: emulator-report/
          if-no-files-found: warn
          retention-days: 14

