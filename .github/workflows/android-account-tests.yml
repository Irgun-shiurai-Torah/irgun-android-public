name: Android Logged-in Account Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/account-tests/**'
      - '.github/workflows/android-account-tests.yml'
      - 'scripts/android-emulator-account*'

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IRGUN_TEST_EMAIL: ${{ secrets.IRGUN_TEST_EMAIL }}
      IRGUN_TEST_PASSWORD: ${{ secrets.IRGUN_TEST_PASSWORD }}
    steps:
      - name: Require dedicated account secrets
        run: |
          test -n "$IRGUN_TEST_EMAIL" && test -n "$IRGUN_TEST_PASSWORD" || { echo "Add IRGUN_TEST_EMAIL and IRGUN_TEST_PASSWORD repository secrets for a verified non-admin test account."; exit 1; }

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Check tab gesture regressions
        run: node --test scripts/test_tab_swipes.cjs scripts/test_android_sources.mjs
      - name: Append read-only account observations to disposable debug build
        run: cat .github/account-tests/observer.js >> src/main.js
      - run: npm run build
      - run: npx cap sync android
      - name: Add emulator-only native volume observation
        run: python3 scripts/android-emulator-prepare.py
      - run: chmod +x android/gradlew
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android 11 logged-in account
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: bash scripts/android-emulator-account.sh
      - name: Save screenshot and crash report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-account-${{ github.run_id }}
          path: |
            emulator-report/account.json
            emulator-report/startup.png
            emulator-report/account-failure.png
          if-no-files-found: warn
          retention-days: 14
