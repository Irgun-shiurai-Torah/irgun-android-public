name: Android native symbols release validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/app/build.gradle'
      - 'scripts/verify_android_native_symbols.sh'
      - 'scripts/test_android_native_symbols.sh'
      - '.github/workflows/android-automatic.yml'
      - '.github/workflows/android-native-debug-symbols.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-native-symbols:
    name: Build release AAB and inspect native symbols
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out PR source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          test -x "$SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy"
      - name: Install app dependencies
        run: npm ci
      - name: Prepare app icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          bash scripts/prepare_android_icons.sh
      - name: Build web app and run source regression tests
        env:
          VITE_ANDROID_MEDIA3_VIDEO_BETA: 'true'
        run: npm run build
      - name: Sync Android project
        run: npx cap sync android
      - name: Generate launcher resources
        run: bash scripts/prepare_android_icons.sh
      - name: Test native-symbol verification cases
        run: bash scripts/test_android_native_symbols.sh

      - name: Build release AAB without publishing
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --info clean :app:bundleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify native debug metadata and R8 mapping
        shell: bash
        run: bash scripts/verify_android_native_symbols.sh android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/mapping/release/mapping.txt symbol-report strict

      - name: Require release AAB to contain no unsymbolicated JNI binaries
        shell: bash
        run: |
          set -euo pipefail
          if unzip -Z1 android/app/build/outputs/bundle/release/app-release.aab | grep -Eq '^base/lib/[^/]+/[^/]+[.]so$'; then
            echo '::error::A native library is still present. This experiment does not eliminate the Play warning.'
            exit 1
          fi
          grep -q 'No native .so libraries in the AAB' symbol-report/native-symbols-status.txt

      - name: Enable KVM for Firebase instrumentation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Firebase installation ID and real FCM token without JNI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: bash scripts/android-firebase-no-jni-smoke.sh

      - name: Upload Firebase JNI-exclusion runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-firebase-no-jni-${{ github.run_id }}
          path: emulator-report/firebase-no-jni-*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload symbol verification listing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-symbol-report-${{ github.run_id }}
          path: symbol-report/
          if-no-files-found: warn
          retention-days: 14
