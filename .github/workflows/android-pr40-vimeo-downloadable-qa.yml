name: Android PR40 Vimeo - Signed QA Download

# Build the unmerged PR #40 code on an isolated branch. Never touch Play tracks.
on:
  push:
    branches:
      - build/android-pr40-vimeo-test-20261021

permissions:
  contents: read

concurrency:
  group: irgun-android-pr40-vimeo-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  IRGUN_ANDROID_VERSION_CODE: '223'
  IRGUN_ANDROID_VERSION_NAME: '1.0.223-vimeoqa'

jobs:
  signed-qa:
    name: Signed Vimeo QA APK and AAB (no Play upload)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout unmerged PR40 snapshot
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Require same signing key as the installed Android app
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/irgun-upload-key.jks"
          test -s "$RUNNER_TEMP/irgun-upload-key.jks"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare Android launcher artwork
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          bash scripts/prepare_android_icons.sh

      - name: Run source checks and bundle native Media3 video
        env:
          VITE_ANDROID_MEDIA3_VIDEO_BETA: 'true'
        run: npm run build

      - name: Sync native Capacitor Android project
        run: npx cap sync android

      - name: Generate Android launcher resources
        run: bash scripts/prepare_android_icons.sh

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          IRGUN_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/irgun-upload-key.jks
          IRGUN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IRGUN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IRGUN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleRelease :app:bundleRelease

      - name: Verify signed APK and native-symbol diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          bash scripts/verify_android_native_symbols.sh android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/mapping/release/mapping.txt build-artifacts/native-symbol-report warn

      - name: Package downloadable QA build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/Irgun-PR40-Vimeo-QA-vc223-signed.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-artifacts/Irgun-PR40-Vimeo-QA-vc223.aab
          cat > build-artifacts/INSTALL-README.txt <<EOF
          Signed Android QA build from unmerged PR #40.
          Source branch: build/android-pr40-vimeo-test-20261021
          Source commit: ${GITHUB_SHA}
          Version: ${IRGUN_ANDROID_VERSION_NAME}; version code ${IRGUN_ANDROID_VERSION_CODE}
          Signed with the same repository release signing key as the main app.
          This workflow does NOT upload to Google Play or deploy any API/site changes.
          Vimeo-only Our Player requires working Vimeo recorded-video API sources.
          If the Worker reports HTTP 503, do not treat native playback as verified.
          EOF

      - name: Publish APK and AAB as GitHub Actions downloads only
        uses: actions/upload-artifact@v7
        with:
          name: Irgun-PR40-Vimeo-QA-vc223-signed
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 30
