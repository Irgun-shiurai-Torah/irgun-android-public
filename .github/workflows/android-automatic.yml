name: Irgun Android - Public Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/public-test-trigger"

permissions:
  contents: read

concurrency:
  group: irgun-android-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: org.irgunshiuraitorah.app
  ANDROID_BASE_VERSION_CODE: "94"

jobs:
  build:
    name: APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set automatic Android version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((ANDROID_BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${VERSION_CODE}"
          echo "IRGUN_ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "IRGUN_ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved Android version: $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Check signing and Play credentials
        id: credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/irgun-upload-key.jks"
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "play=true" >> "$GITHUB_OUTPUT"
          else
            echo "play=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build signed Release APK and AAB
        if: ${{ steps.credentials.outputs.signing == 'true' }}
        working-directory: android
        env:
          IRGUN_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/irgun-upload-key.jks
          IRGUN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IRGUN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IRGUN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Build Debug APK until signing is configured
        if: ${{ steps.credentials.outputs.signing != 'true' }}
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Stage downloadable build files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          if [ "${{ steps.credentials.outputs.signing }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
              "build-artifacts/IrgunApp-${IRGUN_ANDROID_VERSION_NAME}-vc${IRGUN_ANDROID_VERSION_CODE}-signed.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab \
              "build-artifacts/IrgunApp-${IRGUN_ANDROID_VERSION_NAME}-vc${IRGUN_ANDROID_VERSION_CODE}.aab"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk \
              "build-artifacts/IrgunApp-${IRGUN_ANDROID_VERSION_NAME}-vc${IRGUN_ANDROID_VERSION_CODE}-debug.apk"
          fi

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Irgun-Android-${{ steps.version.outputs.version_name }}-vc${{ steps.version.outputs.version_code }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB to Google Play Internal testing
        if: ${{ steps.credentials.outputs.signing == 'true' && steps.credentials.outputs.play == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
